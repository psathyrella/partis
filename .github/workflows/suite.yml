# disjoint-grouping test suite (make test), on every PR into the feature branch

name: Test suite

on:
  pull_request:
    branches:
      - disjoint-grouping

jobs:
  suite:
    runs-on: ubuntu-latest
    env:
      TERM: xterm
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools-scm needs the tags

    - name: Checkout ham and ig-sw submodules
      run: |
        git submodule update --init packages/ham packages/ig-sw

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake libgsl-dev libyaml-cpp-dev scons mafft ncurses-base ncurses-bin

    - name: Install partis and pytest
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . -v
        python -m pip install pytest

    - name: Check xxhash
      run: |
        python -c "import xxhash"

    - name: Run suite
      run: |
        make test
