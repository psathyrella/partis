# disjoint-grouping test suite (make test), when a PR into the feature branch opens, and again when the run-suite label is added

name: Disjoint-grouping tests

on:
  pull_request:
    branches:
      - disjoint-grouping
    types: [opened, reopened, ready_for_review, labeled]  # not on every push

concurrency:  # a newer run cancels an older one of the same kind; unrelated labels get their own group
  group: suite-${{ github.event.pull_request.number }}-${{ github.event.label.name || 'pr' }}
  cancel-in-progress: true

jobs:
  suite:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-suite'
    name: ${{ matrix.backend }} backend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        backend: [cpp, zig]
      fail-fast: false
    env:
      TERM: xterm
      PARTIS_TEST_BACKEND: ${{ matrix.backend }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools-scm needs the tags

    - name: Checkout ham and ig-sw submodules
      run: |
        git submodule update --init packages/ham packages/ig-sw

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake libgsl-dev libyaml-cpp-dev scons mafft ncurses-base ncurses-bin

    - name: Install partis and pytest
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . -v
        python -m pip install pytest

    - name: Check xxhash
      run: |
        python -c "import xxhash"

    - name: Build zig backend
      if: matrix.backend == 'zig'
      run: |
        bin/zig-build.sh

    - name: Run suite
      run: |
        make test
